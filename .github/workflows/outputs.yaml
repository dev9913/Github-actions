name: Output Demo
on: workflow_dispatch
jobs:

  step-output:
    runs-on: ubuntu-latest
    outputs:
      version_job: ${{ steps.version-step.outputs.version2 }}
    steps:
      - name: Genrate Version
        id: version-step
        run: | 
          echo "version=1.0.0" >> $GITHUB_OUTPUT
          echo "version2=2.0.0" >> $GITHUB_OUTPUT
          
      - name: Use Outputs
        run: echo "versin is ${{ steps.version-step.outputs.version }}" 
        
  job-output:
    needs: step-output
    runs-on: ubuntu-latest
    steps:
      - name: Use another job output
        run: |
          echo "Updated Version for my New App Version is  ${{ needs.step-output.outputs.version_job }}"
    
